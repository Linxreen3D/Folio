# Foilio: tägliche Preise, neue Karten und Veröffentlichung der Website.
# Läuft kostenlos auf GitHub Actions, ganz ohne KI.
name: Tägliche Preise und neue Karten

on:
  schedule:
    - cron: "23 4 * * *"   # täglich 04:23 UTC (05:23 Wien im Winter, 06:23 im Sommer)
  workflow_dispatch:        # per Knopfdruck: Actions → dieser Workflow → Run workflow
  push:
    branches: [main]
    paths: ["site/**", "tools/**", ".github/workflows/daily.yml"]

permissions:
  contents: write   # Preisverlauf ins Repository sichern
  pages: write      # Website veröffentlichen
  id-token: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install pillow ijson

      # Rohdaten und Kartenbilder des letzten erfolgreichen Laufs: fällt eine Quelle aus,
      # wird ihr letzter Stand verwendet statt den ganzen Lauf abzubrechen.
      - name: Rohdaten des letzten Laufs wiederherstellen
        uses: actions/cache/restore@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Karten und Preise holen (TCGdex, Scryfall, YGOPRODeck, Lorcast, One Piece)
        run: |
          mkdir -p raw mtgjson _site/data
          python tools/pkm_fetch.py raw --refresh-prices || echo "::warning::Pokémon-Quelle (TCGdex) nicht erreichbar, letzter Stand wird verwendet"
          python tools/others_fetch.py raw mtg ygo lor op

      # auch nach einem Fehler speichern, damit der nächste Lauf auf diesem Stand aufbaut
      - name: Rohdaten für den nächsten Lauf sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}

      - name: Katalog bauen
        run: python tools/build_catalog.py raw _site/data

      - name: Echten Preisverlauf fortschreiben
        run: |
          mkdir -p _site/data/hist
          cp data/hist/*.json _site/data/hist/
          python tools/update_history.py _site/data
          if [ -f _site/data/mtg.json ] \
            && curl -sSf --retry 4 --retry-delay 30 -o mtgjson/AllPrices.json.xz https://mtgjson.com/api/v5/AllPrices.json.xz \
            && curl -sSf --retry 4 --retry-delay 30 -o mtgjson/AllPrintings.sqlite.xz https://mtgjson.com/api/v5/AllPrintings.sqlite.xz \
            && xz -d mtgjson/AllPrintings.sqlite.xz; then
            python tools/mtgjson_backfill.py mtgjson _site/data
          else
            echo "::warning::MTGJSON heute nicht verfügbar, Magic-Verlauf nur aus dem Tagespreis"
          fi
          cp _site/data/hist/*.json data/hist/
          python tools/split_history.py _site/data

      - name: Kartenbilder (Sprites) erzeugen
        run: python tools/sprites.py raw _site/data

      - name: Website zusammenstellen
        run: |
          cp -r site/* _site/
          mkdir -p _site/tools
          for f in tools/*.py; do cp "$f" "_site/tools/$(basename "$f").txt"; done
          cp .github/workflows/daily.yml _site/tools/daily-prices.yml.txt

      # Backend-Zugang (öffentlich, durch Datenbank-Regeln geschützt) aus den Repository-Variablen.
      # Ohne Variablen läuft die Seite im Vorschau-Modus, Angebote bleiben dann auf dem eigenen Gerät.
      - name: Backend-Konfiguration schreiben
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          PAYMENTS: ${{ vars.PAYMENTS }}
        run: python tools/write_config.py _site/config.js

      # Eine echte Seite pro Karte, Set und Spiel, dazu Sitemap und robots.txt (für Google und KI-Suchen)
      - name: Kartenseiten für Google erzeugen
        env:
          SITE_URL_VAR: ${{ vars.SITE_URL }}
        run: |
          SITE_URL="${SITE_URL_VAR:-https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}}"
          echo "Adresse: $SITE_URL"
          python tools/static_pages.py raw _site "$SITE_URL"

      - name: Preisverlauf im Repository sichern
        run: |
          git config user.name "foilio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hist
          git diff --cached --quiet || git commit -m "Preisverlauf $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
